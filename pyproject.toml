[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asfSearchAndDownload"
version = "0.0.1"
description = "Search and download utilities for ASF DAAC (NISAR, Sentinel-1)"
authors = [
    { name = "Ian Joughin", email = "irj@uw.edu" }
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["SAR", "Sentinel1", "NISAR", "ASF"]
requires-python = ">=3.8"

dependencies = [
    "argparse",
    "asf-search",
    "pyyaml",
    "utilities"
]

[tool.setuptools]
packages = ["asfsearchdownload", "asfsearchdownload.searchRegions"]

[tool.setuptools.package-data]
"asfsearchdownload.searchRegions" = ["*.lonlat"]

[project.urls]
Homepage = "https://github.com/fastice/asfSearchAndDownload"
Repository = "https://github.com/fastice/asfSearchAndDownload"

[project.scripts]
checkExcludeFrames = "asfsearchdownload.checkExcludeFrames:main"
ariaDownload = "asfsearchdownload.ariaDownload:main"
"ariaDownload.py" = "asfsearchdownload.ariaDownload:main"
reduces1 = "asfsearchdownload.reduceSentinel1:main"
pullASF = "asfsearchdownload.pullASF:main"
"pullASF.py" = "asfsearchdownload.pullASF:main"
searchASF = "asfsearchdownload.searchASF:main"
downloadNISARoptimized = "asfsearchdownload.downloadNISARoptimized:main"
"downloadNISARoptimized.py" = "asfsearchdownload.downloadNISARoptimized:main"
autoupdateS1 = "asfsearchdownload.autoupdateS1:main"
refreshS1Orbits = "asfsearchdownload.refreshOrbits:main"
fileS1 = "asfsearchdownload.fileS1:main"
"fileS1.py" = "asfsearchdownload.fileS1:main"
queueS1 = "asfsearchdownload.queueS1:main"
"queueS1.py" = "asfsearchdownload.queueS1:main"
checkFramesS1 = "asfsearchdownload.checkFramesS1:main"
"checkFramesS1.py" = "asfsearchdownload.checkFramesS1:main"
